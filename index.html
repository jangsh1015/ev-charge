<title>⚡ 전기차 충전 기록부 (잠금)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(150deg,#0c2320,#10433a 45%,#0d7d58);color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",sans-serif;
 display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:340px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
 border-radius:22px;padding:24px 20px 20px;backdrop-filter:blur(8px);box-shadow:0 18px 48px rgba(0,0,0,.32);text-align:center}
.logo{width:62px;height:62px;border-radius:19px;margin:0 auto 13px;display:flex;align-items:center;justify-content:center;
 font-size:32px;background:linear-gradient(140deg,#12a06e,#0a6647);box-shadow:0 8px 22px rgba(10,150,100,.45)}
h1{font-size:18px;margin:0 0 4px;font-weight:800;letter-spacing:-.4px}
p.sub{font-size:11.5px;margin:0 0 18px;opacity:.66;font-weight:600;letter-spacing:-.2px;
 line-height:1.5}
input[type=password]{width:100%;height:52px;border-radius:13px;border:1px solid rgba(255,255,255,.22);
 background:rgba(0,0,0,.22);color:#fff;font-size:20px;letter-spacing:5px;text-align:center;font-weight:700;outline:none}
input[type=password]::placeholder{letter-spacing:1px;font-size:14px;font-weight:600;opacity:.45}
input[type=password]:focus{border-color:#5eeaaa;box-shadow:0 0 0 3px rgba(94,234,170,.18)}
.remember{display:flex;align-items:center;gap:8px;justify-content:center;margin:13px 0 16px;
 font-size:12.5px;font-weight:600;opacity:.9}
.remember input{width:18px;height:18px;accent-color:#5eeaaa}
button.go{width:100%;height:50px;border:0;border-radius:13px;background:#5eeaaa;color:#06251b;
 font-size:15px;font-weight:800;letter-spacing:-.3px;cursor:pointer}
button.go:active{transform:scale(.985)}
button.go:disabled{opacity:.55}
.err{font-size:12px;font-weight:700;color:#ffb4b4;min-height:17px;margin-top:9px}
.foot{font-size:10.5px;opacity:.5;margin-top:16px;font-weight:600}
.sig{font-size:10.5px;opacity:.42;margin-top:6px;font-weight:600;letter-spacing:.02em}
[hidden]{display:none!important}
</style>
</head>
<body>
<form class="card" id="gate">
  <div class="logo">⚡</div>
  <h1>전기차 충전 기록부</h1>
  <p class="sub">충전 내역과 회원카드 정보가 들어 있어<br>비밀번호로 잠가 두었습니다.</p>
  <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" autofocus>
  <label class="remember"><input type="checkbox" id="remember"> 이 기기에서 기억하기</label>
  <button class="go" id="go" type="submit">열기</button>
  <div class="err" id="err"></div>
  <div class="foot">AES-256-GCM · PBKDF2-SHA256</div>
  <div class="sig">Program by Seokhoon Jang</div>
</form>

const KEY_LS = 'evlog.lock.key.v1';
const q = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pw, salt, iter){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function openWith(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(BLOB.iv)}, key, b64d(BLOB.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async function(){
  if(!window.crypto || !crypto.subtle){ q('err').textContent = '이 브라우저에서는 잠금 해제가 지원되지 않습니다.'; return; }
  const saved = localStorage.getItem(KEY_LS);
  if(saved){
    try{
      const raw = b64d(saved);
      const key = await crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['decrypt']);
      await openWith(key);
      return;
    }catch(e){ localStorage.removeItem(KEY_LS); }
  }
  q('gate').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const btn=q('go'), err=q('err');
    const pw=q('pw').value.trim();
    if(!pw){ err.textContent='비밀번호를 입력해 주세요.'; return; }
    btn.disabled=true; err.textContent='';
    try{
      const key = await deriveKey(pw, b64d(BLOB.salt), BLOB.iter);
      if(q('remember').checked){
        try{
          const raw = await crypto.subtle.exportKey('raw', key);
          localStorage.setItem(KEY_LS, btoa(String.fromCharCode(...new Uint8Array(raw))));
        }catch(e){}
      }
      await openWith(key);
    }catch(e){
      btn.disabled=false; q('pw').value=''; err.textContent='비밀번호가 맞지 않습니다.';
      q('pw').focus();
    }
  });
})();
})();
</script>
